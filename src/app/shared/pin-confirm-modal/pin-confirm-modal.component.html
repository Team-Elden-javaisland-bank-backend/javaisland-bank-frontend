<div class="pin-modal-overlay" (click)="onOverlayClick($event)">
  <div class="pin-modal-card">
    <div class="pin-header">
      <div class="pin-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e5a93c" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2>{{ 'PIN.confirm_title' | translate }}</h2>
      <p>{{ 'PIN.confirm_desc' | translate }}</p>
    </div>

    <div class="pin-inputs">
      @for (digit of digits(); track $index; let i = $index) {
        <input
          #pinInput
          type="password"
          maxlength="1"
          inputmode="numeric"
          pattern="[0-9]"
          [value]="digit"
          (input)="onInput(i, $event)"
          (keydown)="onKeydown(i, $event)"
          class="pin-digit"
          [class.filled]="digit.length === 1"
          [disabled]="loading()"
        />
      }
    </div>

    @if (messageKey()) {
      <div class="pin-message pin-message-error">
        {{ messageKey() }}
      </div>
    }

    <div class="pin-actions">
      <button class="btn btn-gold w-100" (click)="submit()" [disabled]="loading() || digits().some(d => !d)">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        {{ 'PIN.confirm_button' | translate }}
      </button>
      <button class="btn btn-cancel w-100" (click)="cancel()" [disabled]="loading()">
        {{ 'PIN.cancel' | translate }}
      </button>
    </div>
  </div>
</div>
