<div class="auth-page">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-body text-center mb-4">
      <img src="assets/Logo-trasparente.svg" alt="Elden Bank" class="auth-logo">
      <p class="auth-subtitle">Crea il tuo account</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="firstName" class="form-label fw-semibold">Nome</label>
            <input id="firstName" type="text" [(ngModel)]="firstName" name="firstName" class="form-control form-control-lg" placeholder="Mario" />
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="lastName" class="form-label fw-semibold">Cognome</label>
            <input id="lastName" type="text" [(ngModel)]="lastName" name="lastName" class="form-control form-control-lg" placeholder="Rossi" />
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="birthDate" class="form-label fw-semibold">Data di nascita</label>
        <input id="birthDate" type="date" [(ngModel)]="birthDate" name="birthDate" class="form-control form-control-lg" />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" class="form-control form-control-lg" placeholder="mario.rossi@email.com" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" class="form-control form-control-lg" placeholder="Minimo 6 caratteri" />
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-semibold">Conferma password</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control form-control-lg" placeholder="Ripeti la password" />
      </div>

      <button type="submit" class="btn btn-success btn-lg w-100 rounded-3" [disabled]="loading()">
        @if (loading()) { Registrazione in corso... } @else { Registrati }
      </button>
    </form>

    <div class="text-center mt-4">
      <p>Hai già un account? <a routerLink="/login" class="text-decoration-none fw-semibold" style="color: var(--bi-gold);">Accedi</a></p>
    </div>
  </div>
</div>

@if (showSuccessModal()) {
  <div class="modal-overlay" (click)="goToLogin()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <h2>Registrazione completata!</h2>
      <p>Un dipendente dovrà validare il tuo account prima di poter accedere.</p>
      <button class="btn btn-success rounded-3 fw-semibold px-4" (click)="goToLogin()">
        Vai al Login
      </button>
    </div>
  </div>
}
