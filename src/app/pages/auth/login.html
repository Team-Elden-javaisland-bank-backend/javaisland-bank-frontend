<div class="auth-page">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-body text-center mb-4">
      <img src="assets/Logo-trasparente.svg" alt="Elden Bank" class="auth-logo">
      <p class="auth-subtitle">Accedi al tuo account</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          class="form-control form-control-lg"
          placeholder="Inserisci username"
          autocomplete="username"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          class="form-control form-control-lg"
          placeholder="Inserisci password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-success btn-lg w-100 rounded-3" [disabled]="loading()">
        @if (loading()) { Accesso in corso... } @else { Accedi }
      </button>
    </form>

    <div class="text-center mt-4">
      <p>Non hai un account? <a routerLink="/register" class="text-decoration-none fw-semibold" style="color: var(--bi-gold);">Registrati</a></p>
    </div>
  </div>
</div>
