<div class="auth-page">
  <!-- Decorative background elements -->
  <div class="auth-bg-decor">
    <div class="decor-circle decor-1"></div>
    <div class="decor-circle decor-2"></div>
    <div class="decor-line decor-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-card-header">
      <img src="assets/Logo-trasparente.svg" alt="Elden Bank" class="auth-logo" />
      <div class="auth-brand-text">
        <span class="auth-brand-name">Elden Bank</span>
        <span class="auth-brand-tagline">La tua banca digitale</span>
      </div>
    </div>

    <div class="auth-card-body">
      <h1 class="auth-title">Bentornato</h1>
      <p class="auth-subtitle">Accedi al tuo account per continuare</p>

      @if (error()) {
        <div class="auth-alert auth-alert-error" role="alert">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" aria-label="Form di accesso">
        <div class="auth-field">
          <label for="username" class="auth-label">
            <i class="bi bi-person"></i>
            Username
          </label>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            class="auth-input"
            placeholder="Inserisci username"
            autocomplete="username"
            aria-required="true"
          />
        </div>

        <div class="auth-field">
          <label for="password" class="auth-label">
            <i class="bi bi-lock"></i>
            Password
          </label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            class="auth-input"
            placeholder="Inserisci password"
            autocomplete="current-password"
            aria-required="true"
          />
        </div>

        <button type="submit" class="auth-submit" [disabled]="loading()" aria-label="Accedi al tuo account">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-2"></span>Accesso in corso...
          } @else {
            <i class="bi bi-arrow-right-short"></i>Accedi
          }
        </button>
      </form>
    </div>

    <div class="auth-card-footer">
      <p class="auth-footer-text">
        Non hai un account?
        <a routerLink="/register" class="auth-link">Registrati</a>
      </p>
    </div>
  </div>

  <p class="auth-copyright">&copy; 2026 Elden Bank. Tutti i diritti riservati.</p>
</div>
