<div class="pin-page">
  <!-- Language switcher -->
  <div class="auth-lang-switcher">
    <button class="lang-btn" [class.active]="currentLang === 'it'" (click)="switchLang('it')">IT</button>
    <span class="text-white-50">|</span>
    <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="switchLang('en')">EN</button>
  </div>

  <div class="pin-card">
    <div class="pin-header">
      <div class="pin-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e5a93c" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>{{ 'PIN.setup_title' | translate }}</h1>
      <p>{{ 'PIN.setup_desc' | translate }}</p>
    </div>

    <div class="pin-inputs">
      @for (digit of digits(); track $index; let i = $index) {
        <input
          #pinInput
          type="password"
          maxlength="1"
          inputmode="numeric"
          pattern="[0-9]"
          [value]="digit"
          (input)="onInput(i, $event)"
          (keydown)="onKeydown(i, $event)"
          class="pin-digit"
          [class.filled]="digit.length === 1"
          [disabled]="loading()"
        />
      }
    </div>

    <button class="btn btn-gold w-100" (click)="submit()" [disabled]="loading() || digits().some(d => !d)">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      {{ 'PIN.confirm_pin' | translate }}
    </button>

    <p class="pin-hint">{{ 'PIN.pin_hint' | translate }}</p>
  </div>
  <app-toast />
</div>
